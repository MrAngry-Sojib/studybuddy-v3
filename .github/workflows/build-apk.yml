name: Build Android APK (Study Buddy)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor CLI and Core
        run: |
          npm install @capacitor/core @capacitor/cli

      - name: Create Structure and Config
        run: |
          mkdir -p www
          # index.html আছে কি না তা নিশ্চিত করে ব্যাকআপ ফাইল তৈরি করা
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          # বাকি ফাইলগুলো কপি করার নিরাপদ কমান্ড
          cp -r *.js *.css *.json www/ 2>/dev/null || true
          
          # ক্যাপাসিটর কনফিগ তৈরি
          echo '{
            "appId": "com.mrangrysojib.studybuddy",
            "appName": "Study Buddy",
            "webDir": "www",
            "server": {
              "url": "https://mrangry-sojib.github.io/studybuddy-v3/",
              "allowNavigation": ["mrangry-sojib.github.io"]
            }
          }' > capacitor.config.json

      - name: Install Android Platform and Sync
        run: |
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Inject Custom App Logo
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "Custom logo injected successfully!"
          else
            echo "No custom icon.png found."
          fi

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
