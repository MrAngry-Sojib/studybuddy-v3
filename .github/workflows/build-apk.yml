name: Build Android APK (Study Buddy)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Clean Web Directory
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name 'www' ! -name '.git' ! -name '.github' ! -name 'node_modules' ! -name 'android' -exec cp -r {} www/ \;

      - name: Initialize Capacitor Config
        run: |
          echo '{
            "appId": "com.mrangrysojib.studybuddy",
            "appName": "Study Buddy",
            "webDir": "www",
            "server": {
              "url": "https://mrangry-sojib.github.io/studybuddy-v3/",
              "allowNavigation": ["mrangry-sojib.github.io"]
            }
          }' > capacitor.config.json

      - name: Add and Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Custom App Logo
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "Custom logo injected successfully!"
          else
            echo "No custom icon.png found, using default Capacitor logo."
          fi

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
