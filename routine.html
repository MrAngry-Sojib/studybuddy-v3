<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy Pro - Master Timetable Grid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080B11;
            color: #E2E8F0;
            padding-bottom: 90px;
        }
        .header {
            background-color: #0D1520;
            border-bottom: 1px solid #1E293B;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .back-btn {
            background: none;
            border: none;
            color: #38BDF8;
            font-size: 16px;
            cursor: pointer;
        }
        .header h1 { font-size: 16px; font-weight: 800; color: #FFF; }
        
        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 12px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #1E293B;
            border-radius: 16px;
            background-color: #0D1520;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 750px;
        }
        th, td {
            border: 1px solid #1E293B;
            text-align: center;
            vertical-align: middle;
            padding: 10px;
            height: 85px;
            overflow: hidden;
        }
        th {
            background-color: #090D14;
            color: #94A3B8;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            height: 55px;
        }
        .period-time {
            display: block;
            font-size: 9px;
            color: #64748B;
            font-family: monospace;
            margin-top: 2px;
        }
        .day-cell {
            font-weight: 700;
            font-size: 12px;
            color: #FFF;
            background-color: #090D14;
            width: 90px;
        }

        .subject-txt {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #38BDF8;
            word-wrap: break-word;
            margin-bottom: 2px;
        }
        .room-txt {
            display: block;
            font-size: 10px;
            color: #94A3B8;
            font-weight: 600;
        }
        .time-txt-row {
            display: block;
            font-size: 9px;
            color: #64748B;
            font-family: monospace;
            margin-top: 3px;
            font-weight: bold;
        }
        .empty-cell { color: #1E293B; font-weight: bold; font-size: 14px; }
        .today-row { background-color: rgba(56, 189, 248, 0.01); }
        .today-row .day-cell { color: #38BDF8 !important; border-left: 3px solid #38BDF8; }
        
        .running-period-cell {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(37, 99, 235, 0.04)) !important;
            border: 2px solid #38BDF8 !important;
            position: relative;
            animation: neonPulse 2s infinite alternate;
        }
        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 8px;
            font-weight: 900;
            color: #38BDF8;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .live-dot {
            width: 5px;
            height: 5px;
            background-color: #38BDF8;
            border-radius: 50%;
            display: inline-block;
            animation: blinkDot 1s infinite alternate;
        }

        @keyframes neonPulse {
            0% { border-color: #2563EB; box-shadow: inset 0 0 10px rgba(37, 99, 235, 0.1); }
            100% { border-color: #38BDF8; box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2), 0 0 10px rgba(56, 189, 248, 0.1); }
        }
        @keyframes blinkDot { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        .floating-settings {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #38BDF8, #2563EB);
            color: #080B11;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            border: none;
            z-index: 90;
        }

        .popup-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(8, 11, 17, 0.9);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .popup-active { opacity: 1 !important; pointer-events: auto !important; }
        
        .popup-card {
            background-color: #0D1520;
            border: 1px solid #1E293B;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #1E293B;
            padding-bottom: 8px;
        }
        .popup-header h3 { font-size: 14px; font-weight: 800; color: #FFF; }
        .close-btn { background: none; border: none; color: #64748B; font-size: 18px; cursor: pointer; }

        .section-divider {
            font-size: 9px;
            font-weight: 800;
            color: #38BDF8;
            text-transform: uppercase;
            margin: 12px 0 6px 0;
            letter-spacing: 0.5px;
        }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 9px; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 4px; }
        .select-field, .input-field {
            width: 100%;
            background-color: #090D14;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #FFF;
            outline: none;
        }
        .select-field:focus, .input-field:focus { border-color: #38BDF8; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #38BDF8, #2563EB);
            color: #080B11;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-secondary { background: #1A2638; border: 1px solid #20304A; color: #94A3B8; }
        .btn-danger { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }

        /* কাস্টম নোটিফিকেশন টোস্ট ও কনফার্ম বক্স ডিজাইন */
        .custom-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-40px);
            background-color: #0D1520;
            border: 1px solid #ef4444;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            max-width: 90%;
        }
        .custom-toast.toast-success { border-color: #10b981; }
        .custom-toast.toast-active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .custom-toast i { font-size: 16px; }
        .custom-toast .toast-msg { font-size: 12px; font-weight: 600; color: #E2E8F0; line-height: 1.4; }

        .confirm-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .confirm-card {
            background-color: #0D1520;
            border: 1px solid #1E293B;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            text-align: center;
        }
        .confirm-backdrop.confirm-active { opacity: 1; pointer-events: auto; }
        .confirm-backdrop.confirm-active .confirm-card { transform: scale(1); }
        .confirm-icon { font-size: 28px; color: #f59e0b; margin-bottom: 12px; }
        .confirm-text { font-size: 13px; font-weight: 600; color: #E2E8F0; margin-bottom: 18px; line-height: 1.5; }
    </style>
</head>
<body>
    <header class="header">
        <button onclick="window.location.href='index.html'" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Routine Master Grid</h1>
    </header>

    <main class="container">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr id="tableHeaderRow">
                        <th style="width: 90px;">Day</th>
                    </tr>
                </thead>
                <tbody id="timetableGridBody"></tbody>
            </table>
        </div>
    </main>
    <button class="floating-settings" onclick="openSettingsPopup()"><i class="fa-solid fa-gear"></i></button>

    <div id="settingsPopup" class="popup-backdrop">
        <div class="popup-card">
            <div class="popup-header">
                <h3>Routine Control Panel</h3>
                <button class="close-btn" onclick="closeSettingsPopup()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="section-divider">১. পিরিয়ড টাইম ও সংখ্যা কনফিগার</div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Target Period</label>
                    <select id="configPeriodKey" class="select-field" onchange="loadPeriodTimeSetup()"></select>
                </div>
                <div class="input-group">
                    <label>Action Slots</label>
                    <button type="button" class="select-field btn-secondary" style="padding:4px;" onclick="addNewPeriodSlot()">+ Add</button>
                </div>
            </div>
            <div class="grid-2">
                <div class="input-group">
                    <label>Start Time</label>
                    <input type="time" id="configStart" class="input-field">
                </div>
                <div class="input-group">
                    <label>End Time</label>
                    <input type="time" id="configEnd" class="input-field">
                </div>
            </div>
            <div class="grid-2" style="margin-top: 4px;">
                <button type="button" class="btn-action btn-secondary" style="margin-top:0; padding:6px; font-size:10px;" onclick="savePeriodTimeConfig()">Save Time</button>
                <button type="button" class="btn-action btn-danger" style="margin-top:0; padding:6px; font-size:10px;" id="delPeriodBtn" onclick="deleteLastPeriodSlot()">Delete Last</button>
            </div>

            <div class="section-divider" style="margin-top:14px;">২. সাবজেক্ট ও পিরিয়ড রেঞ্জ লক</div>
            <form onsubmit="saveSubjectToGridRange(event)">
                <div class="input-group">
                    <label>Select Day</label>
                    <select id="formDay" class="select-field">
                        <option value="Sunday">Sunday (রবিবার)</option>
                        <option value="Monday">Monday (সোমবার)</option>
                        <option value="Tuesday">Tuesday (মঙ্গলবার)</option>
                        <option value="Wednesday">Wednesday (বুধবার)</option>
                        <option value="Thursday">Thursday (বৃহস্পতিবার)</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label>Start From</label>
                        <select id="formStartPeriod" class="select-field"></select>
                    </div>
                    <div class="input-group">
                        <label>Ends At (Range)</label>
                        <select id="formEndPeriod" class="select-field"></select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Subject Name</label>
                    <input type="text" id="formSubject" required class="input-field" placeholder="যেমন: Physics, Math">
                </div>

                <div class="input-group">
                    <label>Room Number Only</label>
                    <input type="text" id="formRoom" required class="input-field" placeholder="যেমন: 1001, 1020">
                </div>

                <button type="submit" class="btn-action">Lock & Update Routine</button>
            </form>
            
            <button type="button" class="btn-action btn-danger" style="margin-top:8px;" onclick="clearFullRoutineData()">Clear All Data</button>
        </div>
    </div>

    <!-- কাস্টম ডায়নামিক অ্যালার্ট এবং কনফার্ম বক্সের ডম এলিমেন্ট -->
    <div id="customToast" class="custom-toast">
        <i id="toastIcon" class="fa-solid"></i>
        <span id="toastMessage" class="toast-msg"></span>
    </div>

    <div id="customConfirm" class="confirm-backdrop">
        <div class="confirm-card">
            <i class="fa-solid fa-triangle-exclamation confirm-icon"></i>
            <p id="confirmMessage" class="confirm-text"></p>
            <div class="grid-2">
                <button id="confirmCancelBtn" class="btn-action btn-secondary" style="margin-top:0; padding:8px;">না</button>
                <button id="confirmSuccessBtn" class="btn-action" style="margin-top:0; padding:8px; background: #ef4444; color: #FFF;">হ্যাঁ</button>
            </div>
        </div>
    </div>
        <script>
        const workDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
        
        const defaultPeriodsConfig = {
            p1: { name: "1st Period", start: "09:00", end: "09:45" },
            p2: { name: "2nd Period", start: "09:45", end: "10:30" },
            p3: { name: "3rd Period", start: "10:45", end: "11:30" },
            p4: { name: "4th Period", start: "11:30", end: "12:15" },
            p5: { name: "5th Period", start: "13:00", end: "13:45" },
            p6: { name: "6th Period", start: "13:45", end: "14:30" }
        };

        window.onload = function() {
            if (!localStorage.getItem('routine_periods_count_config')) {
                localStorage.setItem('routine_periods_count_config', JSON.stringify(defaultPeriodsConfig));
            }
            buildDropdownSelectors();
            loadPeriodTimeSetup();
            renderMasterGridTable();
            setInterval(renderMasterGridTable, 5000);
        }

        function openSettingsPopup() { document.getElementById('settingsPopup').classList.add('popup-active'); }
        function closeSettingsPopup() { document.getElementById('settingsPopup').classList.remove('popup-active'); }

        // কাস্টম ডায়নামিক টোস্ট ইঞ্জিন (কোনো ব্রাউজার অ্যালার্ট বা ওপরে লেখা থাকবে না)
        function showCustomToast(message, type = 'error') {
            const toast = document.getElementById('customToast');
            const icon = document.getElementById('toastIcon');
            const msgSpan = document.getElementById('toastMessage');

            msgSpan.innerText = message;
            toast.className = 'custom-toast'; 

            if(type === 'success') {
                toast.classList.add('toast-success');
                icon.className = 'fa-solid fa-circle-check';
                icon.style.color = '#10b981';
            } else {
                icon.className = 'fa-solid fa-circle-exclamation';
                icon.style.color = '#ef4444';
            }

            toast.classList.add('toast-active');
            setTimeout(() => {
                toast.classList.remove('toast-active');
            }, 3000);
        }

        // কাস্টম ডায়নামিক কনফার্ম বক্স ইঞ্জিন
        function showCustomConfirm(message, callback) {
            const backdrop = document.getElementById('customConfirm');
            const msgPara = document.getElementById('confirmMessage');
            const yesBtn = document.getElementById('confirmSuccessBtn');
            const noBtn = document.getElementById('confirmCancelBtn');

            msgPara.innerText = message;
            backdrop.classList.add('confirm-active');

            yesBtn.onclick = function() {
                backdrop.classList.remove('confirm-active');
                callback(true);
            };

            noBtn.onclick = function() {
                backdrop.classList.remove('confirm-active');
                callback(false);
            };
        }

        function convertTo12HourFormat(time24) {
            if (!time24) return "--:--";
            let [hours, minutes] = time24.split(':');
            hours = parseInt(hours);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function buildDropdownSelectors() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const pKeys = Object.keys(config).sort((a,b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));
            
            const configSelect = document.getElementById('configPeriodKey');
            const startSelect = document.getElementById('formStartPeriod');
            const endSelect = document.getElementById('formEndPeriod');
            
            configSelect.innerHTML = ''; startSelect.innerHTML = ''; endSelect.innerHTML = '';

            pKeys.forEach(k => {
                const optionText = `${config[k].name} (${convertTo12HourFormat(config[k].start)})`;
                configSelect.innerHTML += `<option value="${k}">${optionText}</option>`;
                startSelect.innerHTML += `<option value="${k}">${config[k].name}</option>`;
                endSelect.innerHTML += `<option value="${k}">${config[k].name}</option>`;
            });
            
            document.getElementById('delPeriodBtn').style.display = (pKeys.length > 6) ? "block" : "none";
        }

        function loadPeriodTimeSetup() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const selectedKey = document.getElementById('configPeriodKey').value;
            if(config[selectedKey]) {
                document.getElementById('configStart').value = config[selectedKey].start;
                document.getElementById('configEnd').value = config[selectedKey].end;
            }
        }

        function addNewPeriodSlot() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const nextIndex = Object.keys(config).length + 1;
            const newKey = `p${nextIndex}`;
            
            config[newKey] = { name: `${nextIndex}th Period`, start: "14:30", end: "15:15" };
            localStorage.setItem('routine_periods_count_config', JSON.stringify(config));
            
            buildDropdownSelectors();
            document.getElementById('configPeriodKey').value = newKey;
            loadPeriodTimeSetup();
            renderMasterGridTable();
        }

        function deleteLastPeriodSlot() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const pKeys = Object.keys(config).sort((a,b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));
            
            if (pKeys.length <= 6) {
                showCustomToast("ডিফল্ট ৬টি পিরিয়ড ডিলিট করা যাবে না!");
                return;
            }

            const lastKey = pKeys[pKeys.length - 1];
            
            showCustomConfirm(`তুমি কি নিশ্চিতভাবে শেষ স্লট (${config[lastKey].name}) ডিলিট করতে চাও?`, function(confirmed) {
                if(confirmed) {
                    delete config[lastKey];
                    localStorage.setItem('routine_periods_count_config', JSON.stringify(config));

                    const gridData = JSON.parse(localStorage.getItem('grid_master_routine_data')) || {};
                    workDays.forEach(day => { delete gridData[`${day}_${lastKey}`]; });
                    localStorage.setItem('grid_master_routine_data', JSON.stringify(gridData));

                    buildDropdownSelectors();
                    loadPeriodTimeSetup();
                    renderMasterGridTable();
                    syncWithOldHomeEngineFormat();
                    showCustomToast("স্লটটি সফলভাবে ডিলিট হয়েছে।", "success");
                }
            });
        }

        function savePeriodTimeConfig() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const selectedKey = document.getElementById('configPeriodKey').value;
            config[selectedKey].start = document.getElementById('configStart').value;
            config[selectedKey].end = document.getElementById('configEnd').value;
            
            localStorage.setItem('routine_periods_count_config', JSON.stringify(config));
            buildDropdownSelectors();
            renderMasterGridTable();
            syncWithOldHomeEngineFormat();
            showCustomToast("精度 পিরিয়ডের সময় সফলভাবে সেভ হয়েছে!", "success");
        }

        function saveSubjectToGridRange(event) {
            event.preventDefault();

            const day = document.getElementById('formDay').value;
            const startP = document.getElementById('formStartPeriod').value;
            const endP = document.getElementById('formEndPeriod').value;
            const subject = document.getElementById('formSubject').value.trim();
            
            let roomInput = document.getElementById('formRoom').value.trim();
            let cleanRoom = roomInput.replace(/^room\s*no\s*[:\- ]*/i, ''); 

            const startIndex = parseInt(startP.substring(1));
            const endIndex = parseInt(endP.substring(1));

            if(startIndex > endIndex) {
                showCustomToast("ভুল রেঞ্জ! শুরুর পিরিয়ড অবশ্যই শেষ পিরিয়ডের আগে বা সমান হতে হবে।");
                return;
            }
            const gridData = JSON.parse(localStorage.getItem('grid_master_routine_data')) || {};
            
            for(let i = startIndex; i <= endIndex; i++) {
                if(gridData[`${day}_p${i}`]) {
                    showCustomToast(`ঝামেলা হয়েছে! p${i} পিরিয়ড অলরেডি অন্য সাবজেক্ট দিয়ে লকড আছে।`);
                    return;
                }
            }

            const spanLength = (endIndex - startIndex) + 1;
            
            for(let i = startIndex; i <= endIndex; i++) {
                if (i === startIndex) {
                    gridData[`${day}_p${i}`] = { subject, room: cleanRoom, isMaster: true, span: spanLength, startKey: startP, endKey: endP };
                } else {
                    gridData[`${day}_p${i}`] = { isChild: true, parentKey: `${day}_p${startIndex}` };
                }
            }

            localStorage.setItem('grid_master_routine_data', JSON.stringify(gridData));
            syncWithOldHomeEngineFormat();
            renderMasterGridTable();
            closeSettingsPopup();
            
            document.getElementById('formSubject').value = '';
            document.getElementById('formRoom').value = '';
            showCustomToast("রুটিন সফলভাবে আপডেট করা হয়েছে!", "success");
        }

        function renderMasterGridTable() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config')) || defaultPeriodsConfig;
            const gridData = JSON.parse(localStorage.getItem('grid_master_routine_data')) || {};
            const pKeys = Object.keys(config).sort((a,b) => parseInt(a.substring(1)) - parseInt(b.substring(1)));

            const headerRow = document.getElementById('tableHeaderRow');
            headerRow.innerHTML = `<th style="width: 90px;">Day</th>`;
            
            pKeys.forEach(k => {
                const displayTimeRange = `${convertTo12HourFormat(config[k].start)} - ${convertTo12HourFormat(config[k].end)}`;
                headerRow.innerHTML += `<th>${config[k].name}<span class="period-time">${displayTimeRange}</span></th>`;
            });

            const now = new Date();
            const englishDays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const currentDayName = englishDays[now.getDay()];
            const currentTimeStr = now.toTimeString().substring(0, 5); 

            const tbody = document.getElementById('timetableGridBody');
            tbody.innerHTML = '';

            workDays.forEach(day => {
                const isToday = (day === currentDayName);
                let rowHtml = `<tr class="${isToday ? 'today-row' : ''}">`;
                rowHtml += `<td class="day-cell">${day.substring(0,3)}day</td>`;

                pKeys.forEach(pKey => {
                    const cell = gridData[`${day}_${pKey}`];
                    if (cell && cell.isChild) return; 

                    let isRunning = false;
                    if (isToday) {
                        if (cell && cell.isMaster) {
                            const sTime = config[cell.startKey].start;
                            const eTime = config[cell.endKey].end;
                            if (currentTimeStr >= sTime && currentTimeStr <= eTime) isRunning = true;
                        } else {
                            if (currentTimeStr >= config[pKey].start && currentTimeStr <= config[pKey].end) isRunning = true;
                        }
                    }

                    const colSpanAttr = (cell && cell.isMaster) ? `colspan="${cell.span}"` : '';

                    rowHtml += `<td ${colSpanAttr} class="${isRunning ? 'running-period-cell' : ''}">`;
                    if (cell && cell.isMaster) {
                        if (isRunning) rowHtml += `<span class="live-tag"><span class="live-dot"></span>Live</span>`;
                        
                        rowHtml += `<span class="subject-txt">${cell.subject}</span>`;
                        rowHtml += `<span class="room-txt">Room no: ${cell.room}</span>`;
                        
                        const formattedRange = `${convertTo12HourFormat(config[cell.startKey].start)} - ${convertTo12HourFormat(config[cell.endKey].end)}`;
                        rowHtml += `<span class="time-txt-row">${formattedRange}</span>`;
                    } else if (!cell) {
                        rowHtml += `<span class="empty-cell">-</span>`;
                    }
                    rowHtml += `</td>`;
                });

                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });
        }

        function syncWithOldHomeEngineFormat() {
            const config = JSON.parse(localStorage.getItem('routine_periods_count_config'));
            const gridData = JSON.parse(localStorage.getItem('grid_master_routine_data')) || {};
            const oldFormatData = {};

            workDays.forEach(day => {
                oldFormatData[day] = [];
                Object.keys(config).forEach(pKey => {
                    const cell = gridData[`${day}_${pKey}`];
                    if(cell && cell.isMaster) {
                        oldFormatData[day].push({
                            subject: cell.subject,
                            startTime: config[cell.startKey].start,
                            endTime: config[cell.endKey].end
                        });
                    } else if (cell && !cell.isChild && !cell.isMaster) {
                        oldFormatData[day].push({
                            subject: cell.subject,
                            startTime: config[pKey].start,
                            endTime: config[pKey].end
                        });
                    }
                });
            });
            localStorage.setItem('student_routine', JSON.stringify(oldFormatData));
        }

        function clearFullRoutineData() {
            showCustomConfirm("তুমি কি নিশ্চিতভাবে পুরো রুটিন ডেটা একদম রিসেট করতে চাও?", function(confirmed) {
                if(confirmed) {
                    localStorage.removeItem('grid_master_routine_data');
                    localStorage.removeItem('student_routine');
                    renderMasterGridTable();
                    closeSettingsPopup();
                    showCustomToast("পুরো রুটিন ডেটা রিসেট করা হয়েছে!", "success");
                }
            });
        }
    </script>
</body>
</html>
