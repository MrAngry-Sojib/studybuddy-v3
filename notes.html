<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy Pro - Study Vault</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080B11;
            color: #E2E8F0;
            padding-bottom: 120px;
        }
        .header {
            background-color: #0D1520;
            border-bottom: 1px solid #1E293B;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .back-btn { background: none; border: none; color: #38BDF8; font-size: 16px; cursor: pointer; }
        .header h1 { font-size: 16px; font-weight: 800; color: #FFF; }
        
        .container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 14px;
        }
        .search-input {
            width: 100%;
            background-color: #0D1520;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 10px 12px 10px 38px;
            font-size: 12px;
            color: #FFF;
            outline: none;
        }
        .search-input:focus { border-color: #38BDF8; }

        .note-card {
            background: linear-gradient(135deg, #0D1520, #131A26);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
            border: 1px solid #1E293B;
            border-left: 4px solid #38BDF8;
            transition: transform 0.2s;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 10px;
        }
        .note-header h3 { font-size: 14px; font-weight: 800; color: #FFF; line-height: 1.3; }
        
        .note-actions-top { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-top-icon { background: none; border: none; color: #475569; font-size: 12px; cursor: pointer; }
        .btn-top-icon:hover, .btn-top-icon:active { color: #38BDF8; }
        .pinned-active { color: #F59E0B !important; }

        .note-body-text {
            font-size: 11px;
            color: #94A3B8;
            line-height: 1.5;
            margin-bottom: 10px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .locked-mask-zone {
            background-color: rgba(9, 13, 20, 0.6);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #64748B;
            cursor: pointer;
            border: 1px dashed #1E293B;
            margin-bottom: 10px;
        }
        .locked-mask-zone i { color: #EF4444; margin-bottom: 4px; display: block; font-size: 14px; }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(30, 41, 59, 0.3);
            padding-top: 8px;
            font-size: 9px;
            font-weight: 600;
            color: #475569;
        }
        .cat-badge {
            background-color: #090D14;
            padding: 2px 6px;
            border-radius: 4px;
            color: #38BDF8;
            font-weight: 700;
        }
        .floating-add {
            position: fixed; bottom: 24px; right: 24px; width: 50px; height: 50px;
            background: linear-gradient(135deg, #38BDF8, #2563EB); color: #080B11;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35); border: none; z-index: 90;
        }

        .popup-backdrop {
            position: fixed; inset: 0; background-color: rgba(8, 11, 17, 0.9);
            backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
            padding: 15px; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .popup-active { opacity: 1 !important; pointer-events: auto !important; }
        
        .popup-card { background-color: #0D1520; border: 1px solid #1E293B; border-radius: 24px; padding: 20px; width: 100%; max-width: 360px; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1E293B; padding-bottom: 8px; }
        .popup-header h3 { font-size: 14px; font-weight: 800; color: #FFF; }
        .close-btn { background: none; border: none; color: #64748B; font-size: 18px; cursor: pointer; }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 9px; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 4px; }
        .input-field { width: 100%; background-color: #090D14; border: 1px solid #1E293B; border-radius: 8px; padding: 10px; font-size: 12px; color: #FFF; outline: none; }
        .input-field:focus { border-color: #38BDF8; }

        .lock-checkbox-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; background: #090D14; padding: 8px; border-radius: 8px; border: 1px solid #1E293B; }
        .lock-checkbox-row label { font-size: 11px; font-weight: 700; color: #94A3B8; cursor: pointer; }
        .lock-checkbox-row input { cursor: pointer; width: 14px; height: 14px; accent-color: #EF4444; }

        .btn-save { width: 100%; background: linear-gradient(135deg, #38BDF8, #2563EB); color: #080B11; border: none; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 6px; }
        .no-data { text-align: center; font-size: 11px; color: #64748B; padding: 30px; border: 1px dashed #1E293B; border-radius: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* কাস্টম টোস্ট, কনফার্ম ও সিকিউর প্রম্পট সিএসএস */
        .custom-toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-40px);
            background-color: #0D1520; border: 1px solid #ef4444; padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 90%;
        }
        .custom-toast.toast-success { border-color: #10b981; }
        .custom-toast.toast-active { opacity: 1; transform: translateX(-50%) translateY(0); }
        .custom-toast .toast-msg { font-size: 12px; font-weight: 600; color: #E2E8F0; line-height: 1.4; }

        .confirm-backdrop {
            position: fixed; inset: 0; background-color: rgba(8, 11, 17, 0.85); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .confirm-card {
            background-color: #0D1520; border: 1px solid #1E293B; border-radius: 20px; padding: 20px;
            width: 100%; max-width: 320px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); transform: scale(0.9); transition: transform 0.3s ease; text-align: center;
        }
        .confirm-backdrop.confirm-active { opacity: 1; pointer-events: auto; }
        .confirm-backdrop.confirm-active .confirm-card { transform: scale(1); }
        .confirm-icon { font-size: 28px; color: #f59e0b; margin-bottom: 12px; }
        .confirm-text { font-size: 13px; font-weight: 600; color: #E2E8F0; margin-bottom: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <header class="header">
        <button onclick="window.location.href='index.html'" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Study Vault Notepad</h1>
    </header>

    <main class="container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="noteSearchInput" class="search-input" placeholder="নোটের শিরোনাম, বিষয় বা সাবজেক্ট দিয়ে সার্চ করো..." oninput="renderNotesVaultList()">
        </div>

        <div id="notesListContainer"></div>
    </main>

    <button class="floating-add" onclick="openNotePopup()"><i class="fa-solid fa-pen-nib"></i></button>

    <div id="notePopup" class="popup-backdrop">
        <div class="popup-card">
            <div class="popup-header">
                <h3 id="formModeTitle">Create New Vault Note</h3>
                <button class="close-btn" onclick="closeNotePopup()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveOrUpdateVaultNote(event)">
                <input type="hidden" id="noteEditIndex" value="-1">
                
                <div class="input-group">
                    <label>Subject / Category Name</label>
                    <input type="text" id="ntCategory" required class="input-field" placeholder="যেমন: Physics, Biology, Assignment">
                </div>

                <div class="input-group">
                    <label>Note Title</label>
                    <input type="text" id="ntTitle" required class="input-field" placeholder="শিরোনাম যুক্ত করো">
                </div>

                <div class="input-group">
                    <label>Note Content</label>
                    <textarea id="ntContent" required class="input-field" rows="5" placeholder="তোমার দরকারি পড়ার তথ্য বা সূত্র এখানে লেখো..." style="resize: none; font-family: inherit; line-height:1.5;"></textarea>
                </div>

                <div class="lock-checkbox-row">
                    <input type="checkbox" id="ntIsLocked">
                    <label for="ntIsLocked"><i class="fa-solid fa-lock" style="color:#EF4444; margin-right:4px;"></i> Lock note with Class Roll password</label>
                </div>

                <button type="submit" class="btn-save" id="formSubmitBtn">Lock to Vault</button>
            </form>
        </div>
    </div>

    <div id="customToast" class="custom-toast">
        <i id="toastIcon" class="fa-solid"></i>
        <span id="toastMessage" class="toast-msg"></span>
    </div>

    <div id="customConfirm" class="confirm-backdrop">
        <div class="confirm-card">
            <i class="fa-solid fa-trash-can confirm-icon" style="color:#ef4444;"></i>
            <p id="confirmMessage" class="confirm-text"></p>
            <div class="grid-2">
                <button id="confirmCancelBtn" class="btn-save btn-secondary" style="margin-top:0; padding:8px; background: #1E293B; border: 1px solid #334155; color: #94A3B8;">না</button>
                <button id="confirmSuccessBtn" class="btn-save" style="margin-top:0; padding:8px; background: #ef4444; color: #FFF;">হ্যাঁ</button>
            </div>
        </div>
    </div>

    <div id="promptPopup" class="confirm-backdrop">
        <div class="confirm-card" style="max-width: 340px; text-align: left;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; color:#38BDF8;">
                <i class="fa-solid fa-user-shield" style="font-size:20px;"></i>
                <h4 style="font-size:14px; font-weight:800; color:#FFF;">সিক্রেট ভল্ট প্রটেকশন</h4>
            </div>
            <p style="font-size: 11px; color:#94A3B8; margin-bottom:12px; line-height:1.5;">নোটের সুরক্ষিত তথ্যটি দেখতে তোমার প্রোফাইলের ক্লাস রোল নম্বরটি প্রবেশ করাও:</p>
            <div class="input-group">
                <input type="password" id="promptRollInput" class="input-field" placeholder="রোল নম্বর লেখো" style="text-align: center; letter-spacing: 2px;">
            </div>
            <div class="grid-2" style="margin-top:14px;">
                <button id="promptCancelBtn" class="btn-save btn-secondary" style="margin-top:0; padding:10px; background: #1E293B; border: 1px solid #334155; color: #94A3B8;">বাতিল</button>
                <button id="promptSuccessBtn" class="btn-save" style="margin-top:0; padding:10px;">আনলক করো</button>
            </div>
        </div>
    </div>
        <script>
        const userRollPassword = localStorage.getItem('profile_roll') || "123";
        let unlockedNotesCache = {};
        let activeCallback = null;

        window.onload = function() {
            renderNotesVaultList();
        }

        // ডায়নামিক টোস্ট ইঞ্জিন
        function showCustomToast(message, type = 'error') {
            const toast = document.getElementById('customToast');
            const icon = document.getElementById('toastIcon');
            const msgSpan = document.getElementById('toastMessage');

            msgSpan.innerText = message;
            toast.className = 'custom-toast'; 

            if(type === 'success') {
                toast.classList.add('toast-success');
                icon.className = 'fa-solid fa-circle-check';
                icon.style.color = '#10b981';
            } else {
                icon.className = 'fa-solid fa-circle-exclamation';
                icon.style.color = '#ef4444';
            }

            toast.classList.add('toast-active');
            setTimeout(() => {
                toast.classList.remove('toast-active');
            }, 3000);
        }

        // ডায়নামিক কনফার্ম বক্স ইঞ্জিন
        function showCustomConfirm(message, callback) {
            const backdrop = document.getElementById('customConfirm');
            const msgPara = document.getElementById('confirmMessage');
            const yesBtn = document.getElementById('confirmSuccessBtn');
            const noBtn = document.getElementById('confirmCancelBtn');

            msgPara.innerText = message;
            backdrop.classList.add('confirm-active');

            yesBtn.onclick = function() {
                backdrop.classList.remove('confirm-active');
                callback(true);
            };
            noBtn.onclick = function() {
                backdrop.classList.remove('confirm-active');
                callback(false);
            };
        }

        // কাস্টম ডায়নামিক প্রোম্পট বক্স (রোল পাসওয়ার্ড ইনপুটের জন্য বিশেষ মেকানিজম)
        function showCustomPrompt(callback) {
            const backdrop = document.getElementById('promptPopup');
            const inputField = document.getElementById('promptRollInput');
            const yesBtn = document.getElementById('promptSuccessBtn');
            const noBtn = document.getElementById('promptCancelBtn');

            inputField.value = '';
            backdrop.classList.add('confirm-active');
            inputField.focus();

            yesBtn.onclick = function() {
                const val = inputField.value.trim();
                backdrop.classList.remove('confirm-active');
                callback(val);
            };
            noBtn.onclick = function() {
                backdrop.classList.remove('confirm-active');
                callback(null);
            };
        }

        function openNotePopup() { document.getElementById('notePopup').classList.add('popup-active'); }
        function closeNotePopup() { 
            document.getElementById('notePopup').classList.remove('popup-active'); 
            document.getElementById('noteEditIndex').value = "-1";
            document.getElementById('formModeTitle').innerText = "Create New Vault Note";
            document.getElementById('formSubmitBtn').innerText = "Lock to Vault";
            document.getElementById('ntTitle').value = '';
            document.getElementById('ntContent').value = '';
            document.getElementById('ntCategory').value = '';
            document.getElementById('ntIsLocked').checked = false;
        }

        function calculateReadTime(text) {
            const words = text.trim().split(/\s+/).length;
            const time = Math.ceil(words / 200);
            return `${time} min read`;
        }

        function renderNotesVaultList() {
            const notesList = JSON.parse(localStorage.getItem('student_vault_notes')) || [];
            const container = document.getElementById('notesListContainer');
            const searchKey = document.getElementById('noteSearchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            if (notesList.length === 0) {
                container.innerHTML = `<div class="no-data">ভল্ট একদম ফাঁকা! পড়ার দরকারি তথ্য সেভ করতে নিচের কলম আইকনে চাপ দাও।</div>`;
                return;
            }

            notesList.sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return new Date(b.timestamp) - new Date(a.timestamp);
            });

            let renderedCount = 0;

            notesList.forEach((note) => {
                if (searchKey && !note.title.toLowerCase().includes(searchKey) && !note.content.toLowerCase().includes(searchKey) && !note.category.toLowerCase().includes(searchKey)) {
                    return; 
                }

                renderedCount++;
                const isLocked = note.isLocked && !unlockedNotesCache[note.timestamp];
                const readTimeStr = calculateReadTime(note.content);
                const noteId = note.timestamp; 

                let cardHtml = `
                    <div class="note-card">
                        <div class="note-header">
                            <h3>${note.title}</h3>
                            <div class="note-actions-top">
                                <button class="btn-top-icon ${note.isPinned ? 'pinned-active' : ''}" onclick="togglePinNote('${noteId}')" title="Pin to top">
                                    <i class="fa-solid fa-thumbtack"></i>
                                </button>
                                <button class="btn-top-icon" onclick="triggerEditNoteSetup('${noteId}')" title="Edit Note">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn-top-icon" style="color:#EF4444;" onclick="deleteVaultNote('${noteId}')" title="Delete Note">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                `;

                if (isLocked) {
                    cardHtml += `
                        <div class="locked-mask-zone" onclick="attemptUnlockNote('${noteId}')">
                            <i class="fa-solid fa-user-shield"></i>
                            <span>এই নোটটি লক করা আছে। আনলক করতে এখানে ট্যাপ করে ক্লাস রোল পাসওয়ার্ড দাও।</span>
                        </div>
                    `;
                } else {
                    cardHtml += `<p class="note-body-text">${note.content}</p>`;
                }

                cardHtml += `
                        <div class="note-footer">
                            <span class="cat-badge">${note.category}</span>
                            <span>${note.dateLabel} | ${readTimeStr}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });

            if (renderedCount === 0 && searchKey) {
                container.innerHTML = `<div class="no-data">সার্চের সাথে মিল পাওয়া কোনো নোট খুঁজে পাওয়া যায়নি!</div>`;
            }
        }

        function attemptUnlockNote(noteId, successCallback = null) {
            showCustomPrompt(function(inputPass) {
                if (inputPass === null) return;
                if (inputPass === userRollPassword) {
                    unlockedNotesCache[noteId] = true;
                    renderNotesVaultList();
                    showCustomToast("নোটটি সফলভাবে আনলক হয়েছে!", "success");
                    if(successCallback) successCallback();
                } else {
                    showCustomToast("❌ ভুল রোল নম্বর! পাসওয়ার্ড মিলেনি।", "error");
                }
            });
        }

        function saveOrUpdateVaultNote(event) {
            event.preventDefault();

            const category = document.getElementById('ntCategory').value.trim();
            const title = document.getElementById('ntTitle').value.trim();
            const content = document.getElementById('ntContent').value.trim();
            const isLocked = document.getElementById('ntIsLocked').checked;
            const editIndex = parseInt(document.getElementById('noteEditIndex').value);

            const notesList = JSON.parse(localStorage.getItem('student_vault_notes')) || [];
            const now = new Date();
            const dateLabel = `${now.getDate().toString().padStart(2,'0')}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getFullYear()}`;

            if (editIndex === -1) {
                notesList.push({
                    category, title, content, isLocked, isPinned: false,
                    timestamp: now.toISOString(), dateLabel
                });
                showCustomToast("নতুন নোট সফলভাবে ভল্টে লক করা হয়েছে!", "success");
            } else {
                const existing = notesList[editIndex];
                notesList[editIndex] = {
                    category, title, content, isLocked,
                    isPinned: existing.isPinned, timestamp: existing.timestamp, dateLabel
                };
                showCustomToast("নোটের তথ্য সফলভাবে আপডেট করা হয়েছে!", "success");
            }

            localStorage.setItem('student_vault_notes', JSON.stringify(notesList));
            closeNotePopup();
            renderNotesVaultList();
        }

        function triggerEditNoteSetup(noteId) {
            const notesList = JSON.parse(localStorage.getItem('student_vault_notes')) || [];
            const index = notesList.findIndex(n => n.timestamp === noteId);
            if (index === -1) return;
            
            const note = notesList[index];

            if (note.isLocked && !unlockedNotesCache[noteId]) {
                attemptUnlockNote(noteId, function() {
                    proceedToEditForm(note, index);
                });
            } else {
                proceedToEditForm(note, index);
            }
        }

        function proceedToEditForm(note, index) {
            openNotePopup();
            document.getElementById('noteEditIndex').value = index;
            document.getElementById('formModeTitle').innerText = "Modify Vault Note";
            document.getElementById('formSubmitBtn').innerText = "Apply Changes";

            document.getElementById('ntCategory').value = note.category;
            document.getElementById('ntTitle').value = note.title;
            document.getElementById('ntContent').value = note.content;
            document.getElementById('ntIsLocked').checked = note.isLocked;
        }

        function togglePinNote(noteId) {
            const notesList = JSON.parse(localStorage.getItem('student_vault_notes')) || [];
            const index = notesList.findIndex(n => n.timestamp === noteId);
            if (index !== -1) {
                notesList[index].isPinned = !notesList[index].isPinned;
                localStorage.setItem('student_vault_notes', JSON.stringify(notesList));
                renderNotesVaultList();
            }
        }

        function deleteVaultNote(noteId) {
            showCustomConfirm("তুমি কি নিশ্চিতভাবে এই নোটটি ভল্ট থেকে মুছে ফেলতে চাও?", function(confirmed) {
                if (confirmed) {
                    const notesList = JSON.parse(localStorage.getItem('student_vault_notes')) || [];
                    const index = notesList.findIndex(n => n.timestamp === noteId);
                    if (index !== -1) {
                        notesList.splice(index, 1);
                        localStorage.setItem('student_vault_notes', JSON.stringify(notesList));
                        renderNotesVaultList();
                        showCustomToast("নোটটি ভল্ট থেকে ডিলিট করা হয়েছে।", "success");
                    }
                }
            });
        }
    </script>
</body>
</html>
