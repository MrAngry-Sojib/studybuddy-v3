<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy Pro - Daily Quests Engine</title>
    <!-- আইকনের জন্য FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080B11;
            color: #E2E8F0;
            padding-bottom: 120px;
        }
        .header {
            background-color: #0D1520;
            border-bottom: 1px solid #1E293B;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .back-btn { background: none; border: none; color: #38BDF8; font-size: 16px; cursor: pointer; }
        .header h1 { font-size: 16px; font-weight: 800; color: #FFF; }
        
        .container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        /* ডেইলি কোয়েস্ট স্ট্যাটাস ড্যাশবোর্ড */
        .quest-tracker-card {
            background: linear-gradient(135deg, #0F172A, #0D1520);
            border: 1px solid #1E293B;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .tracker-headline { font-size: 13px; font-weight: 800; color: #FFF; display: flex; justify-content: space-between; }
        .tracker-sub { font-size: 10px; color: #64748B; margin-top: 4px; line-height: 1.4; }
        
        .quest-bar-bg { width: 100%; height: 6px; background-color: #090D14; border-radius: 10px; margin-top: 12px; overflow: hidden; }
        .quest-bar-fill { height: 100%; background: linear-gradient(90deg, #10B981, #059669); width: 0%; transition: width 0.3s; }

        /* ডাইনামিক কোয়েস্ট আইটেম লিস্ট */
        .task-item {
            background: #0D1520;
            border: 1px solid #1E293B;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s;
        }
        .task-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        
        /* কাস্টম প্রিমিয়াম চেকবক্স */
        .custom-check-btn {
            background: none; border: 2px solid #334155; width: 20px; height: 20px;
            border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: transparent; transition: all 0.2s; flex-shrink: 0;
        }
        .task-completed .custom-check-btn { background: #10B981; border-color: #10B981; color: #080B11; }
        
        .task-details h4 { font-size: 13px; font-weight: 700; color: #E2E8F0; line-height: 1.4; }
        .task-completed .task-details h4 { color: #475569; text-decoration: line-through; }
        
        /* প্রায়োরিটি ট্যাগ ইন্ডিকেটর */
        .prio-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .prio-High { background-color: #EF4444; box-shadow: 0 0 8px #EF4444; }
        .prio-Medium { background-color: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
        .prio-Low { background-color: #38BDF8; box-shadow: 0 0 8px #38BDF8; }

        .btn-del-task { background: none; border: none; color: #475569; cursor: pointer; font-size: 13px; padding: 4px; }
        .btn-del-task:hover { color: #EF4444; }
                /* ফ্লোটিং অ্যাড বাটন */
        .floating-add {
            position: fixed; bottom: 24px; right: 24px; width: 50px; height: 50px;
            background: linear-gradient(135deg, #10B981, #059669); color: #080B11;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); border: none; z-index: 90;
        }

        .btn-flush-pane {
            width: 100%; background: rgba(30, 41, 59, 0.2); border: 1px dashed #1E293B;
            color: #64748B; padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-flush-pane:active { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); color: #EF4444; }

        /* পপ-আপ ফর্ম মড্যুল */
        .popup-backdrop {
            position: fixed; inset: 0; background-color: rgba(8, 11, 17, 0.9);
            backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
            padding: 15px; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .popup-active { opacity: 1 !important; pointer-events: auto !important; }
        
        .popup-card { background-color: #0D1520; border: 1px solid #1E293B; border-radius: 24px; padding: 20px; width: 100%; max-width: 360px; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1E293B; padding-bottom: 8px; }
        .popup-header h3 { font-size: 14px; font-weight: 800; color: #FFF; }
        .close-btn { background: none; border: none; color: #64748B; font-size: 18px; cursor: pointer; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 9px; font-weight: 700; color: #64748B; text-transform: uppercase; margin-bottom: 4px; }
        .input-field, .select-field { width: 100%; background-color: #090D14; border: 1px solid #1E293B; border-radius: 8px; padding: 10px; font-size: 12px; color: #FFF; outline: none; }
        .input-field:focus, .select-field:focus { border-color: #10B981; }

        .btn-save { width: 100%; background: linear-gradient(135deg, #10B981, #059669); color: #080B11; border: none; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 6px; }
        .no-data { text-align: center; font-size: 11px; color: #64748B; padding: 30px; border: 1px dashed #1E293B; border-radius: 16px; }
    </style>
</head>
<body>

    <!-- হেডার বার -->
    <header class="header">
        <button onclick="window.location.href='index.html'" class="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Daily Quests Backlog</h1>
    </header>

    <main class="container">
        
        <!-- কোয়েস্ট প্রোগ্রেস ড্যাশবอร์ด কার্ড -->
        <div class="quest-tracker-card">
            <div class="tracker-headline">
                <span>Today's Milestones</span>
                <span id="questCounterLabel" style="color:#10B981;">0 / 3 Done</span>
            </div>
            <p class="tracker-sub">বোনাস এক্সপি আনলক করতে আজ মিনিমাম ৩টি কোয়েস্ট শেষ করো। অলসতা করলে কিন্তু এক্সপি কেটে নেওয়া হবে!</p>
            <div class="quest-bar-bg">
                <div id="questProgressBar" class="quest-bar-fill"></div>
            </div>
        </div>

        <!-- ডাইনামিক টাস্ক কন্টেইনার লিস্ট -->
        <div id="taskListContainer">
            <!-- টাস্ক কার্ডস জাভাস্ক্রিপ্ট দিয়ে এখানে ইনজেক্ট হবে -->
        </div>

        <!-- ফ্লাশ কমপ্লিটেড টাস্ক বাটন -->
        <button class="btn-flush-pane" onclick="clearAllCompletedQuests()">
            Clear Finished Quests <i class="fa-solid fa-fire-burner"></i>
        </button>

    </main>

    <!-- ফ্লোটিং অ্যাড কোয়েস্ট বাটন -->
    <button class="floating-add" onclick="openTaskPopup()"><i class="fa-solid fa-plus"></i></button>

    <!-- পপ-আপ মড্যুল ফর্ম -->
    <div id="taskPopup" class="popup-backdrop">
        <div class="popup-card">
            <div class="popup-header">
                <h3>Deploy New Daily Quest</h3>
                <button class="close-btn" onclick="closeTaskPopup()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="createNewDailyQuest(event)">
                <div class="input-group">
                    <label>Quest Objective (টাস্কের নাম)</label>
                    <input type="text" id="tkName" required class="input-field" placeholder="যেমন: Physics ২য় অধ্যায় পড়া শেষ করা">
                </div>

                <div class="input-group">
                    <label>Priority Level</label>
                    <select id="tkPriority" class="select-field">
                        <option value="High">High Priority (জরুরি কাজ)</option>
                        <option value="Medium" selected>Medium Priority (স্বাভাবিক)</option>
                        <option value="Low">Low Priority (ঐচ্ছিক)</option>
                    </select>
                </div>

                <button type="submit" class="btn-save">Launch Quest Card</button>
            </form>
        </div>
    </div>
        <script>
        const userName = localStorage.getItem('profile_name') || "স্টুডেন্ট";

        window.onload = function() {
            initializeTaskDailySystemAndCheckPunishment();
            renderDailyQuestsList();
        }

        function openTaskPopup() { document.getElementById('taskPopup').classList.add('popup-active'); }
        function closeTaskPopup() { 
            document.getElementById('taskPopup').classList.remove('popup-active'); 
            document.getElementById('tkName').value = '';
        }

        // [স্মার্ট ডেইলি ট্র্যাকার ও পানিশমেন্ট ইঞ্জিন]
        function initializeTaskDailySystemAndCheckPunishment() {
            const todayStr = new Date().toDateString();
            
            // নতুন দিন শুরু হয়েছে কি না চেক
            if (localStorage.getItem('task_system_date_string') !== todayStr) {
                
                // [কঠোর পানিশমেন্ট চেক] যদি গতকাল কোনো টাস্ক অ্যাড না করে থাকে অথবা একটাও কমপ্লিট না করে থাকে
                if (localStorage.getItem('task_system_date_string')) {
                    const yesterdayTotal = parseInt(localStorage.getItem('yesterday_added_count')) || 0;
                    const yesterdayDone = parseInt(localStorage.getItem('yesterday_completed_count')) || 0;
                    
                    if (yesterdayTotal === 0 || yesterdayDone === 0) {
                        // অলসতার জন্য এক্সপি মাইনাস ১৫
                        let currentXp = parseInt(localStorage.getItem('global_vault_xp')) || 0;
                        currentXp = Math.max(0, currentXp - 15); // ০ এর নিচে নামবে না
                        localStorage.setItem('global_vault_xp', currentXp.toString());
                        
                        alert(`⚠️ অলসতা অ্যালার্ট, ${userName}!\n\nতুমি গতকাল কোনো টাস্ক অ্যাড করোনি অথবা অ্যাড করলেও একটি কাজও শেষ করোনি। এই অবহেলার জন্য তোমার গ্লোবাল ব্যাংক থেকে ১৫ এক্সপি (XP) কেটে নেওয়া হলো। আজ দায়িত্বশীল হও!`);
                    }
                }

                // নতুন দিনের মেমোরি স্লট সেটআপ ও ব্যাকআপ ক্যাশ জিরো করা
                localStorage.setItem('task_system_date_string', todayStr);
                localStorage.setItem('today_bonus_claimed', 'false');
                
                // বর্তমানের রানিং টাস্কগুলোকে গতকালের ট্র্যাকিংয়ে ব্যাকআপ নিয়ে নেওয়া
                syncYesterdayMetrics();
            }
        }

        function syncYesterdayMetrics() {
            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            const doneCount = taskList.filter(t => t.completed).length;
            localStorage.setItem('yesterday_added_count', taskList.length.toString());
            localStorage.setItem('yesterday_completed_count', doneCount.toString());
        }

        // কোয়েস্ট লিস্ট জেনারেটর এবং হোম স্ক্রিন সিঙ্ক ইঞ্জিন
        function renderDailyQuestsList() {
            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            const container = document.getElementById('taskListContainer');
            container.innerHTML = '';

            // আজকের কমপ্লিটেড এবং পেন্ডিং টাস্কের হিসাব
            const completedCount = taskList.filter(t => t.completed).length;
            const pendingCount = taskList.length - completedCount;

            // [হোম স্ক্রিন এলার্ট সিঙ্ক] হোম পেজের liveTaskCard রিড করার জন্য মেমোরি আপডেট
            localStorage.setItem('student_tasks', JSON.stringify(taskList)); 

            // ড্যাশবোর্ড বার এবং কাউন্টার আপডেট
            document.getElementById('questCounterLabel').innerText = `${completedCount} / 3 Done`;
            // প্রোগ্রেস বার ৩টি টাস্কের ওপর ভিত্তি করে সর্বোচ্চ ১০০% লোড হবে
            const progressPercent = Math.min(100, (completedCount / 3) * 100);
            document.getElementById('questProgressBar').style.width = `${progressPercent}%`;

            // [৩-টাস্ক রিওয়ার্ড লক] ৩টি টাস্ক কমপ্লিট হলে এককালীন +২০ এক্সপি ডেইলি বোনাস
            if (completedCount >= 3 && localStorage.getItem('today_bonus_claimed') !== 'true') {
                localStorage.setItem('today_bonus_claimed', 'true');
                let currentXp = parseInt(localStorage.getItem('global_vault_xp')) || 0;
                currentXp += 20; // ২০ এক্সপি ডেইলি বোনাস
                localStorage.setItem('global_vault_xp', currentXp.toString());
                alert(`🎉 অসাধারণ কাজ করেছ, ${userName}!\n\nতুমি আজকের দিনের মিনিмум ৩টি ডেইলি কোয়েস্ট সফলভাবে কমপ্লিট করেছ। পুরস্কার হিসেবে তোমার গ্লোবাল ব্যাংকে এককালীন +20 XP বোনাস যোগ করা হলো!`);
            }

            if (taskList.length === 0) {
                container.innerHTML = `<div class="no-data">আজকের কোনো কোয়েস্ট কার্ড বাকি নেই, ${userName}! নতুন টাস্ক যোগ করতে নিচের প্লাস আইকনে চাপ দাও।</div>`;
                return;
            }

            taskList.forEach((task, index) => {
                let itemHtml = `
                    <div class="task-item ${task.completed ? 'task-completed' : ''}">
                        <div class="task-left">
                            <button class="custom-check-btn" onclick="toggleQuestCompleteStatus(${index})">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <div class="task-details">
                                <h4><span class="prio-dot prio-${task.priority}"></span>${task.text}</h4>
                            </div>
                        </div>
                        <button class="btn-del-task" onclick="deleteSingleQuest(${index})">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.innerHTML += itemHtml;
            });

            // দিন শেষ হওয়ার আগে সেভড ব্যাকআপ সিঙ্ক আপডেট রাখা
            syncYesterdayMetrics();
        }

        // নতুন টাস্ক কার্ড যোগ করা
        function createNewDailyQuest(event) {
            event.preventDefault();

            const text = document.getElementById('tkName').value.trim();
            const priority = document.getElementById('tkPriority').value;

            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            taskList.push({ text, priority, completed: false });

            localStorage.setItem('student_tasks', JSON.stringify(taskList));
            closeTaskPopup();
            renderDailyQuestsList();
        }

        // টাস্ক চেক আনচেক ইঞ্জিন
        function toggleQuestCompleteStatus(index) {
            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            taskList[index].completed = !taskList[index].completed;
            
            localStorage.setItem('student_tasks', JSON.stringify(taskList));
            renderDailyQuestsList();
        }

        // সিঙ্গল কোয়েস্ট ডিলিট
        function deleteSingleQuest(index) {
            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            taskList.splice(index, 1);
            localStorage.setItem('student_tasks', JSON.stringify(taskList));
            renderDailyQuestsList();
        }

        // কাজ শেষ হয়ে যাওয়া ট্র্যাশ নোটগুলো এক ক্লিকে পরিষ্কার করা
        function clearAllCompletedQuests() {
            const taskList = JSON.parse(localStorage.getItem('student_tasks')) || [];
            const remainingTasks = taskList.filter(task => !task.completed);
            
            if (taskList.length === remainingTasks.length) {
                alert("পরিষ্কার করার মতো কোনো কমপ্লিটেড কোয়েস্ট লিস্টে নেই!");
                return;
            }

            if (confirm("তুমি কি শেষ হয়ে যাওয়া সব কাজগুলো মেমোরি থেকে ফ্লাশ করে দিতে চাও?")) {
                localStorage.setItem('student_tasks', JSON.stringify(remainingTasks));
                renderDailyQuestsList();
            }
        }
    </script>
</body>
</html>
